name: qwen36-27b-bf16-rp6000-blackbird
description: Blackbird RTX PRO 6000 real TUI config for Qwen/Qwen3.6-27B (BF16, kv bf16).
model: Qwen/Qwen3.6-27B
served_model_name: qwen36-27b-bf16-rp6000
command:
  entrypoint: serve
  executable: ./scripts/blackbird_qwen36_bf16_vllm_foreground.sh
engine:
  gpu_memory_utilization: 0.95
  max_model_len: 262144
  dtype: bfloat16
  kv_cache_dtype: bfloat16
  max_num_seqs: 4
server:
  host: 0.0.0.0
  port: 18002
  exposure: lan
  api_key: EMPTY
logging:
  request_logging: false
  suppress_access_log_for: [/health]
env:
  CONTAINER: qwen36-27b-bf16-rp6000-vela
  ROOT: /home/bgconley/models/qwen36-27b-bf16
  HF_CACHE_ROOT: /home/bgconley/models/qwen36-27b-bf16/hf-cache
  PULL_IMAGE: "0"
extra_args:
  - --max-num-batched-tokens
  - "8192"
  - --trust-remote-code
  - --language-model-only
  - --enable-prefix-caching
  - --enable-auto-tool-choice
  - --reasoning-parser
  - qwen3
  - --tool-call-parser
  - qwen3_coder
launch:
  mode: attached
  ready_timeout_seconds: 1800
  health:
    interval_seconds: 2
  runs_dir: /home/bgconley/models/qwen36-27b-bf16/vela-runs
vllm:
  version_profile: "0.11"
