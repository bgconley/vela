[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vllm-loader"
version = "0.1.0"
description = "Phase-aware Textual TUI and CLI for launching vLLM servers from named configs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "vLLM Loader contributors" }]
dependencies = [
  "httpx>=0.27",
  "psutil>=5.9",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "rich>=13.7",
  "textual>=0.86",
  "typer>=0.12",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.535"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
vllm-loader = "vllm_loader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
