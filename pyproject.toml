[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vela"
version = "0.1.0"
description = "Vela is a phase-aware terminal TUI for launching vLLM servers from named configs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vela contributors" }]
dependencies = [
  "huggingface-hub>=0.27",
  "httpx>=0.27",
  "psutil>=5.9",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "rich>=13.7",
  "textual>=8.2,<9",
  "tqdm>=4.66",
  "typer>=0.12",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.535"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/bgconley/vela"
Changelog = "https://github.com/bgconley/vela/blob/main/CHANGELOG.md"

[project.scripts]
vela = "vela.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vela"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
files = ["src/vela"]
ignore_missing_imports = true

# Incremental adoption: the modules below predate type checking and are the
# burn-down list (143 historical errors). Everything else — and every new
# module — is checked by default.
[[tool.mypy.overrides]]
module = [
  "vela.agent.local",
  "vela.cli",
  "vela.engine.build_registry",
  "vela.engine.model_registry",
  "vela.engine.process_manager",
  "vela.engine.supervisor",
  "vela.tui.app",
  "vela.tui.screens.config_picker",
  "vela.tui.screens.flag_manager",
  "vela.tui.screens.model_manager",
  "vela.tui.screens.new_deployment",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
