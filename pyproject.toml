[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vela"
version = "0.1.0"
description = "Vela is a phase-aware terminal TUI for launching vLLM servers from named configs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vela contributors" }]
dependencies = [
  "huggingface-hub>=0.27",
  "httpx>=0.27",
  "psutil>=5.9",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "rich>=13.7",
  "textual>=0.86",
  "tqdm>=4.66",
  "typer>=0.12",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.535"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
vela = "vela.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vela"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
