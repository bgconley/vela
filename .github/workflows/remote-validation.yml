name: Remote Validation

on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: "Validation profile: fast skips Qwen/full resume; full runs requested real surfaces"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - fast
      host:
        description: "SSH host for the GPU/controller validation node"
        required: true
        default: "bgconley@10.25.0.50"
      remote_path:
        description: "Absolute repo path on the remote host"
        required: true
        default: "/home/bgconley/repos/vela"
      remote_target:
        description: "Optional target name on the validation host, e.g. blackbird"
        required: false
        default: "blackbird"
      real_config:
        description: "Optional real config name for smoke-tui"
        required: false
        default: "qwen36-27b-fp8-kvfp8-rp6000-blackbird"
      real_resume_config:
        description: "Optional real config for resume/daemon-restart validation"
        required: false
        default: "tiny-random-llama-detached-blackbird"
      remote_venv:
        description: "Remote validation venv path"
        required: true
        default: "/home/bgconley/venvs/vela"
      remote_timeout:
        description: "Timeout seconds for real smoke-tui"
        required: true
        default: "2700"
      build_spec:
        description: "Optional real build spec, for example vllm==0.11.2"
        required: false
        default: "vllm==0.11.2"
      model_repo:
        description: "Optional Hugging Face model repo to pin/download"
        required: false
        default: "hf-internal-testing/tiny-random-LlamaForCausalLM"
      model_revision:
        description: "Optional model revision"
        required: false
        default: "main"
      gated_model_repo:
        description: "Optional gated Hugging Face repo for no-token auth validation"
        required: false
        default: ""
      gated_model_id:
        description: "Model id label for the gated auth validation probe"
        required: false
        default: "remote-gated-model"
      gated_model_revision:
        description: "Optional gated model revision"
        required: false
        default: ""
      ssh_opts:
        description: "Additional SSH options"
        required: false
        default: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new"
      runner_label:
        description: "Runner label with network access to the remote host"
        required: true
        default: "self-hosted"
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: remote-validation-blackwell
  cancel-in-progress: false

jobs:
  remote-validation:
    runs-on: ${{ github.event.inputs.runner_label || vars.VELA_REMOTE_RUNNER_LABEL || 'self-hosted' }}
    env:
      VALIDATION_PROFILE: ${{ github.event.inputs.validation_profile || vars.VELA_REMOTE_PROFILE || 'full' }}
      REMOTE_VALIDATION_HOST: ${{ github.event.inputs.host || vars.VELA_REMOTE_HOST || 'bgconley@10.25.0.50' }}
      REMOTE_VALIDATION_PATH: ${{ github.event.inputs.remote_path || vars.VELA_REMOTE_PATH || '/home/bgconley/repos/vela' }}
      REMOTE_VALIDATION_REAL_CONFIG: ${{ github.event.inputs.real_config || vars.VELA_REMOTE_REAL_CONFIG || 'qwen36-27b-fp8-kvfp8-rp6000-blackbird' }}
      VELA_REMOTE_ARTIFACT: "1"
      VELA_REMOTE_ARTIFACT_DIR: artifacts/remote-validation
      VELA_REMOTE_TIMEOUT: ${{ github.event.inputs.remote_timeout || vars.VELA_REMOTE_TIMEOUT || '2700' }}
      VELA_REMOTE_VENV: ${{ github.event.inputs.remote_venv || vars.VELA_REMOTE_VENV || '/home/bgconley/venvs/vela' }}
      VELA_REMOTE_TARGET: ${{ github.event.inputs.remote_target || vars.VELA_REMOTE_TARGET || 'blackbird' }}
      VELA_REMOTE_BUILD_SPEC: ${{ github.event.inputs.build_spec || vars.VELA_REMOTE_BUILD_SPEC || 'vllm==0.11.2' }}
      VELA_REMOTE_BUILD_LABEL: ${{ vars.VELA_REMOTE_BUILD_LABEL || format('gha-{0}-{1}-build', github.run_id, github.run_attempt) }}
      VELA_REMOTE_MODEL_ID: ${{ vars.VELA_REMOTE_MODEL_ID || format('gha-{0}-{1}-model', github.run_id, github.run_attempt) }}
      VELA_REMOTE_MODEL_REPO: ${{ github.event.inputs.model_repo || vars.VELA_REMOTE_MODEL_REPO || 'hf-internal-testing/tiny-random-LlamaForCausalLM' }}
      VELA_REMOTE_MODEL_REVISION: ${{ github.event.inputs.model_revision || vars.VELA_REMOTE_MODEL_REVISION || 'main' }}
      VELA_REMOTE_GATED_MODEL_REPO: ${{ github.event.inputs.gated_model_repo || vars.VELA_REMOTE_GATED_MODEL_REPO || '' }}
      VELA_REMOTE_GATED_MODEL_ID: ${{ github.event.inputs.gated_model_id || vars.VELA_REMOTE_GATED_MODEL_ID || 'remote-gated-model' }}
      VELA_REMOTE_GATED_MODEL_REVISION: ${{ github.event.inputs.gated_model_revision || vars.VELA_REMOTE_GATED_MODEL_REVISION || '' }}
      VELA_REMOTE_REAL_RESUME_CONFIG: ${{ github.event.inputs.real_resume_config || vars.VELA_REMOTE_REAL_RESUME_CONFIG || 'tiny-random-llama-detached-blackbird' }}
      VELA_REMOTE_PYTEST_ARGS: ${{ vars.VELA_REMOTE_PYTEST_ARGS || '-q tests/test_remote_workflow.py tests/test_transport_factory.py tests/test_targets.py' }}
      VELA_REMOTE_SSH_KEY: ${{ secrets.VELA_REMOTE_SSH_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        if: ${{ env.VELA_REMOTE_SSH_KEY != '' }}
        run: |
          mkdir -p "$HOME/.ssh"
          key_path="$HOME/.ssh/vela-remote-validation"
          printf '%s\n' "$VELA_REMOTE_SSH_KEY" > "$key_path"
          chmod 600 "$key_path"
          eval "$(ssh-agent -s)"
          ssh-add "$key_path"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "VELA_SSH_OPTS=-A -i $key_path ${{ github.event.inputs.ssh_opts || vars.VELA_REMOTE_SSH_OPTS || '-o BatchMode=yes -o StrictHostKeyChecking=accept-new' }}"
          } >> "$GITHUB_ENV"

      - name: Configure SSH options without key
        if: ${{ env.VELA_REMOTE_SSH_KEY == '' }}
        run: |
          echo "VELA_SSH_OPTS=${{ github.event.inputs.ssh_opts || vars.VELA_REMOTE_SSH_OPTS || '-o BatchMode=yes -o StrictHostKeyChecking=accept-new' }}" >> "$GITHUB_ENV"

      - name: Run remote validation
        run: |
          if [[ "$VALIDATION_PROFILE" == "fast" ]]; then
            unset VELA_REMOTE_REAL_RESUME_CONFIG
            REMOTE_VALIDATION_REAL_CONFIG=""
          fi
          args=("$REMOTE_VALIDATION_HOST" "$REMOTE_VALIDATION_PATH")
          if [[ -n "$REMOTE_VALIDATION_REAL_CONFIG" ]]; then
            args+=("$REMOTE_VALIDATION_REAL_CONFIG")
          fi
          bash scripts/run_remote_tests.sh "${args[@]}"

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-validation-artifacts
          path: artifacts/remote-validation/*.md
          if-no-files-found: error
