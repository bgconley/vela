name: Remote Validation

on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: "Validation profile: fast skips Qwen/full resume; full runs requested real surfaces"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - fast
      host:
        description: "SSH host for the GPU/controller validation node (blank = VELA_REMOTE_HOST repo variable)"
        required: false
        default: ""
      remote_path:
        description: "Absolute repo path on the remote host (blank = VELA_REMOTE_PATH repo variable)"
        required: false
        default: ""
      remote_target:
        description: "Optional target name on the validation host (blank = VELA_REMOTE_TARGET repo variable)"
        required: false
        default: ""
      real_config:
        description: "Optional real config name for smoke-tui (blank = VELA_REMOTE_REAL_CONFIG repo variable)"
        required: false
        default: ""
      real_resume_config:
        description: "Optional real config for resume/daemon-restart validation (blank = VELA_REMOTE_REAL_RESUME_CONFIG repo variable)"
        required: false
        default: ""
      remote_venv:
        description: "Remote validation venv path (blank = VELA_REMOTE_VENV repo variable)"
        required: false
        default: ""
      remote_timeout:
        description: "Timeout seconds for real smoke-tui"
        required: true
        default: "2700"
      build_spec:
        description: "Optional real build spec, for example vllm==0.11.2"
        required: false
        default: "vllm==0.11.2"
      model_repo:
        description: "Optional Hugging Face model repo to pin/download"
        required: false
        default: "hf-internal-testing/tiny-random-LlamaForCausalLM"
      model_revision:
        description: "Optional model revision"
        required: false
        default: "main"
      gated_model_repo:
        description: "Optional gated Hugging Face repo for no-token auth validation"
        required: false
        default: ""
      gated_model_id:
        description: "Model id label for the gated auth validation probe"
        required: false
        default: "remote-gated-model"
      gated_model_revision:
        description: "Optional gated model revision"
        required: false
        default: ""
      ssh_opts:
        description: "Additional SSH options"
        required: false
        default: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new"
      runner_label:
        description: "Runner label with network access to the remote host"
        required: true
        default: "self-hosted"
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: remote-validation-blackwell
  cancel-in-progress: false

jobs:
  remote-validation:
    runs-on: ${{ github.event.inputs.runner_label || vars.VELA_REMOTE_RUNNER_LABEL || 'self-hosted' }}
    env:
      VALIDATION_PROFILE: ${{ github.event.inputs.validation_profile || vars.VELA_REMOTE_PROFILE || 'full' }}
      REMOTE_VALIDATION_HOST: ${{ github.event.inputs.host || vars.VELA_REMOTE_HOST }}
      REMOTE_VALIDATION_PATH: ${{ github.event.inputs.remote_path || vars.VELA_REMOTE_PATH }}
      REMOTE_VALIDATION_REAL_CONFIG: ${{ github.event.inputs.real_config || vars.VELA_REMOTE_REAL_CONFIG }}
      VELA_REMOTE_ARTIFACT: "1"
      VELA_REMOTE_ARTIFACT_DIR: artifacts/remote-validation
      VELA_REMOTE_TIMEOUT: ${{ github.event.inputs.remote_timeout || vars.VELA_REMOTE_TIMEOUT || '2700' }}
      VELA_REMOTE_VENV: ${{ github.event.inputs.remote_venv || vars.VELA_REMOTE_VENV }}
      VELA_REMOTE_TARGET: ${{ github.event.inputs.remote_target || vars.VELA_REMOTE_TARGET }}
      VELA_REMOTE_BUILD_SPEC: ${{ github.event.inputs.build_spec || vars.VELA_REMOTE_BUILD_SPEC || 'vllm==0.11.2' }}
      VELA_REMOTE_BUILD_LABEL: ${{ vars.VELA_REMOTE_BUILD_LABEL || format('gha-{0}-{1}-build', github.run_id, github.run_attempt) }}
      VELA_REMOTE_MODEL_ID: ${{ vars.VELA_REMOTE_MODEL_ID || format('gha-{0}-{1}-model', github.run_id, github.run_attempt) }}
      VELA_REMOTE_MODEL_REPO: ${{ github.event.inputs.model_repo || vars.VELA_REMOTE_MODEL_REPO || 'hf-internal-testing/tiny-random-LlamaForCausalLM' }}
      VELA_REMOTE_MODEL_REVISION: ${{ github.event.inputs.model_revision || vars.VELA_REMOTE_MODEL_REVISION || 'main' }}
      VELA_REMOTE_GATED_MODEL_REPO: ${{ github.event.inputs.gated_model_repo || vars.VELA_REMOTE_GATED_MODEL_REPO || '' }}
      VELA_REMOTE_GATED_MODEL_ID: ${{ github.event.inputs.gated_model_id || vars.VELA_REMOTE_GATED_MODEL_ID || 'remote-gated-model' }}
      VELA_REMOTE_GATED_MODEL_REVISION: ${{ github.event.inputs.gated_model_revision || vars.VELA_REMOTE_GATED_MODEL_REVISION || '' }}
      VELA_REMOTE_REAL_RESUME_CONFIG: ${{ github.event.inputs.real_resume_config || vars.VELA_REMOTE_REAL_RESUME_CONFIG }}
      VELA_REMOTE_PYTEST_ARGS: ${{ vars.VELA_REMOTE_PYTEST_ARGS || '-q tests/test_remote_workflow.py tests/test_transport_factory.py tests/test_targets.py' }}
      VELA_REMOTE_SSH_KEY: ${{ secrets.VELA_REMOTE_SSH_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        if: ${{ env.VELA_REMOTE_SSH_KEY != '' }}
        run: |
          mkdir -p "$HOME/.ssh"
          key_path="$HOME/.ssh/vela-remote-validation"
          printf '%s\n' "$VELA_REMOTE_SSH_KEY" > "$key_path"
          chmod 600 "$key_path"
          eval "$(ssh-agent -s)"
          ssh-add "$key_path"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            # Lab-only outer-hop forwarding: docs/gpu-workflow.md records why
            # this can be acceptable for the runner-to-controller shell. Vela's
            # controller-to-agent SSH transport still hard-blocks forwarding.
            echo "VELA_SSH_OPTS=-A -i $key_path ${{ github.event.inputs.ssh_opts || vars.VELA_REMOTE_SSH_OPTS || '-o BatchMode=yes -o StrictHostKeyChecking=accept-new' }}"
          } >> "$GITHUB_ENV"

      - name: Configure SSH options without key
        if: ${{ env.VELA_REMOTE_SSH_KEY == '' }}
        run: |
          echo "VELA_SSH_OPTS=${{ github.event.inputs.ssh_opts || vars.VELA_REMOTE_SSH_OPTS || '-o BatchMode=yes -o StrictHostKeyChecking=accept-new' }}" >> "$GITHUB_ENV"

      - name: Run remote validation
        id: remote_validation
        run: |
          if [[ -z "$REMOTE_VALIDATION_HOST" || -z "$REMOTE_VALIDATION_PATH" ]]; then
            echo "::error::Validation host/path not configured — set repo variables VELA_REMOTE_HOST and VELA_REMOTE_PATH (or pass dispatch inputs)."
            exit 1
          fi
          if [[ "$VALIDATION_PROFILE" == "fast" ]]; then
            unset VELA_REMOTE_REAL_RESUME_CONFIG
            REMOTE_VALIDATION_REAL_CONFIG=""
          fi
          args=("$REMOTE_VALIDATION_HOST" "$REMOTE_VALIDATION_PATH")
          if [[ -n "$REMOTE_VALIDATION_REAL_CONFIG" ]]; then
            args+=("$REMOTE_VALIDATION_REAL_CONFIG")
          fi
          bash scripts/run_remote_tests.sh "${args[@]}"

      - name: Write validation failure artifact
        id: validation_failure_artifact
        if: failure() && steps.remote_validation.outputs.artifact_path == ''
        run: |
          mkdir -p artifacts/remote-validation
          artifact_path="artifacts/remote-validation/remote-validation-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          {
            echo "# Vela Remote Validation Failure"
            echo
            echo "- Workflow run: \`${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Reason: validation exited before writing a run artifact"
          } > "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-validation-artifacts
          path: |
            ${{ steps.remote_validation.outputs.artifact_path }}
            ${{ steps.validation_failure_artifact.outputs.artifact_path }}
          if-no-files-found: error
